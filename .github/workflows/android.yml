name: Android app
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the file mediahub.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk mediahub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mediahub-apk
          path: mediahub.apk
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mediahub.apk
